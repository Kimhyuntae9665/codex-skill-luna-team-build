<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-labelledby="chart-title chart-desc"
     viewBox="0 0 1200 760"
     width="1200"
     height="760">
  <title id="chart-title">Luna 오케스트레이션 관측 벤치마크</title>
  <desc id="chart-desc">서로 다른 작업 부하에서 측정한 실제 병렬성, 작업자 슬롯 활용도, 균형 지표를 비교한 네 행의 차트입니다. 표준화된 속도 향상 벤치마크가 아닙니다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1c31"/>
    </linearGradient>
    <linearGradient id="teal-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fe5d1"/>
      <stop offset="100%" stop-color="#23a99f"/>
    </linearGradient>
    <linearGradient id="blue-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#85b8ff"/>
      <stop offset="100%" stop-color="#3d70d6"/>
    </linearGradient>
    <linearGradient id="violet-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0a5ff"/>
      <stop offset="100%" stop-color="#7655cb"/>
    </linearGradient>
    <linearGradient id="amber-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd68a"/>
      <stop offset="100%" stop-color="#cb8b39"/>
    </linearGradient>
    <filter id="panel-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .title { fill: #f4f8ff; font: 700 31px Inter, "Noto Sans KR", "Segoe UI", sans-serif; letter-spacing: -0.8px; }
      .eyebrow { fill: #6fe5d1; font: 700 12px Inter, "Noto Sans KR", "Segoe UI", sans-serif; letter-spacing: 2px; }
      .subtitle { fill: #9db1ca; font: 400 15px Inter, "Noto Sans KR", "Segoe UI", sans-serif; }
      .panel { fill: #10223a; stroke: #203956; stroke-width: 1; }
      .panel-title { fill: #f4f8ff; font: 700 18px Inter, "Noto Sans KR", "Segoe UI", sans-serif; }
      .panel-subtitle { fill: #8fa5bf; font: 400 12px Inter, "Noto Sans KR", "Segoe UI", sans-serif; }
      .axis { stroke: #7891ad; stroke-width: 1.2; }
      .grid { stroke: #29415d; stroke-width: 1; stroke-dasharray: 3 7; }
      .tick { fill: #7891ad; font: 400 11px Inter, "Noto Sans KR", "Segoe UI", sans-serif; }
      .value { fill: #f4f8ff; font: 700 14px Inter, "Noto Sans KR", "Segoe UI", sans-serif; }
      .category { fill: #c1d0e2; font: 500 11px Inter, "Noto Sans KR", "Segoe UI", sans-serif; }
      .micro { fill: #8fa5bf; font: 400 10px Inter, "Noto Sans KR", "Segoe UI", sans-serif; }
      .note-head { fill: #ffd68a; font: 700 12px Inter, "Noto Sans KR", "Segoe UI", sans-serif; letter-spacing: 1px; }
      .note { fill: #c6d3e3; font: 400 12px Inter, "Noto Sans KR", "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#background)"/>
  <circle cx="1105" cy="42" r="150" fill="#15345a" opacity="0.22"/>
  <circle cx="1130" cy="65" r="82" fill="#1a5571" opacity="0.12"/>

  <text x="42" y="49" class="eyebrow">LUNA / OBSERVED ORCHESTRATION</text>
  <text x="42" y="91" class="title">병렬성은 슬롯 수보다 균형에 달려 있습니다</text>
  <text x="42" y="119" class="subtitle">실제 실행 요약에서 추출한 wall time · worker 합계 · 활용도 · 균형 · 시작 편차</text>

  <rect x="42" y="166" width="548" height="438" rx="18" class="panel" filter="url(#panel-shadow)"/>
  <rect x="610" y="166" width="548" height="438" rx="18" class="panel" filter="url(#panel-shadow)"/>

  <text x="70" y="205" class="panel-title">실제 병렬성</text>
  <text x="70" y="228" class="panel-subtitle">Σ worker 시간 ÷ wall time · 실행 중 겹친 작업량의 관측값</text>

  <line x1="102" y1="520" x2="558" y2="520" class="axis"/>
  <line x1="102" y1="470.8" x2="558" y2="470.8" class="grid"/>
  <line x1="102" y1="421.5" x2="558" y2="421.5" class="grid"/>
  <line x1="102" y1="372.3" x2="558" y2="372.3" class="grid"/>
  <line x1="102" y1="323.1" x2="558" y2="323.1" class="grid"/>
  <line x1="102" y1="273.8" x2="558" y2="273.8" class="grid"/>
  <text x="88" y="524" text-anchor="end" class="tick">0</text>
  <text x="88" y="474.8" text-anchor="end" class="tick">1</text>
  <text x="88" y="425.5" text-anchor="end" class="tick">2</text>
  <text x="88" y="376.3" text-anchor="end" class="tick">3</text>
  <text x="88" y="327.1" text-anchor="end" class="tick">4</text>
  <text x="88" y="277.8" text-anchor="end" class="tick">5</text>

  <rect x="125" y="472.1" width="72" height="47.9" rx="8" fill="url(#teal-bar)"/>
  <rect x="235" y="285.7" width="72" height="234.3" rx="8" fill="url(#blue-bar)"/>
  <rect x="345" y="313.6" width="72" height="206.4" rx="8" fill="url(#violet-bar)"/>
  <rect x="455" y="470.8" width="72" height="49.2" rx="8" fill="url(#amber-bar)"/>

  <text x="161" y="459" text-anchor="middle" class="value">0.974</text>
  <text x="271" y="272" text-anchor="middle" class="value">4.762</text>
  <text x="381" y="300" text-anchor="middle" class="value">4.191</text>
  <text x="491" y="457" text-anchor="middle" class="value">1.000</text>

  <text x="161" y="548" text-anchor="middle" class="category">
    <tspan x="161" dy="0">1개 · token</tspan>
    <tspan x="161" dy="15">smoke</tspan>
  </text>
  <text x="271" y="548" text-anchor="middle" class="category">
    <tspan x="271" dy="0">7개 · equal</tspan>
    <tspan x="271" dy="15">token smoke</tspan>
  </text>
  <text x="381" y="548" text-anchor="middle" class="category">
    <tspan x="381" dy="0">7개 · varied</tspan>
    <tspan x="381" dy="15">Council audit</tspan>
  </text>
  <text x="491" y="548" text-anchor="middle" class="category">
    <tspan x="491" dy="0">1개 · architecture</tspan>
    <tspan x="491" dy="15">review</tspan>
  </text>

  <text x="70" y="589" class="micro">표시 순서: token smoke · equal token smoke · varied Council audit · architecture review</text>

  <text x="638" y="205" class="panel-title">활용도와 균형</text>
  <text x="638" y="228" class="panel-subtitle">활용도 / 균형 · 두 값 모두 1.000에 가까울수록 안정적</text>
  <rect x="1010" y="203" width="9" height="9" rx="2" fill="#6fe5d1"/>
  <text x="1025" y="212" class="micro">활용도</text>
  <rect x="1081" y="203" width="9" height="9" rx="2" fill="#f08d8d"/>
  <text x="1096" y="212" class="micro">균형</text>

  <line x1="756" y1="258" x2="756" y2="520" class="axis"/>
  <line x1="838.5" y1="258" x2="838.5" y2="520" class="grid"/>
  <line x1="921" y1="258" x2="921" y2="520" class="grid"/>
  <line x1="1003.5" y1="258" x2="1003.5" y2="520" class="grid"/>
  <line x1="1086" y1="258" x2="1086" y2="520" class="axis"/>
  <text x="756" y="244" text-anchor="middle" class="tick">0</text>
  <text x="838.5" y="244" text-anchor="middle" class="tick">0.25</text>
  <text x="921" y="244" text-anchor="middle" class="tick">0.50</text>
  <text x="1003.5" y="244" text-anchor="middle" class="tick">0.75</text>
  <text x="1086" y="244" text-anchor="middle" class="tick">1.00</text>

  <text x="638" y="292" class="category">1개 · token smoke</text>
  <rect x="756" y="282" width="321.4" height="10" rx="5" fill="#6fe5d1"/>
  <rect x="756" y="299" width="330" height="10" rx="5" fill="#f08d8d"/>
  <text x="1140" y="306" text-anchor="end" class="micro">0.974 / 1.000</text>

  <text x="638" y="354" class="category">7개 · equal token</text>
  <rect x="756" y="344" width="224.4" height="10" rx="5" fill="#6fe5d1"/>
  <rect x="756" y="361" width="178.9" height="10" rx="5" fill="#f08d8d"/>
  <text x="1140" y="368" text-anchor="end" class="micro">0.680 / 0.542</text>

  <text x="638" y="416" class="category">7개 · Council audit</text>
  <rect x="756" y="406" width="197.7" height="10" rx="5" fill="#6fe5d1"/>
  <rect x="756" y="423" width="43.6" height="10" rx="5" fill="#f08d8d"/>
  <text x="1140" y="430" text-anchor="end" class="micro">0.599 / 0.132</text>

  <text x="638" y="478" class="category">1개 · architecture</text>
  <rect x="756" y="468" width="330" height="10" rx="5" fill="#6fe5d1"/>
  <rect x="756" y="485" width="330" height="10" rx="5" fill="#f08d8d"/>
  <text x="1140" y="492" text-anchor="end" class="micro">1.000 / 1.000</text>

  <text x="638" y="548" class="micro">wall(s): 8.513 · 18.407 · 404.988 · 180.643</text>
  <text x="638" y="565" class="micro">Σ worker(s): 8.294 · 87.661 · 1697.198 · 180.561</text>
  <text x="638" y="582" class="micro">시작 편차(s): 0.000 · 0.254 · 0.223 · 0.000</text>

  <rect x="42" y="630" width="1116" height="94" rx="16" fill="#10223a" stroke="#203956" stroke-width="1"/>
  <text x="68" y="658" class="note-head">해석 주의</text>
  <text x="68" y="682" class="note">네 행은 서로 다른 workload에서 측정되었습니다.</text>
  <text x="68" y="703" class="note">따라서 이 그림은 오케스트레이션 동작과 straggler 위험을 보여주며, apples-to-apples 표준 speedup benchmark가 아닙니다.</text>
</svg>
